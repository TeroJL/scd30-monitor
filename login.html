<!DOCTYPE html>
<html lang="fi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MQTT Dashboard - Login</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

<h1>MQTT Dashboard</h1>

<form id="loginForm">

<label for="broker">

Broker Address

</label>

<input
type="text"
id="broker"
placeholder="wss://broker.example.com:8884/mqtt"
required>

<label for="username">

Username

</label>

<input
type="text"
id="username"
required>

<label for="password">

Password

</label>

<input
type="password"
id="password"
required>

<button type="submit">

Save and Continue

</button>

</form>

</div>

<script>

document.getElementById("broker").value =
localStorage.getItem("mqttBroker") ||
"wss://220eb1c6c03d48fea06df6599189b756.s1.eu.hivemq.cloud:8884/mqtt";

document.getElementById("username").value =
localStorage.getItem("mqttUsername") || "";

document.getElementById("password").value =
localStorage.getItem("mqttPassword") || "";

document.getElementById("loginForm").addEventListener("submit",function(e){

    e.preventDefault();

    localStorage.setItem(
        "mqttBroker",
        document.getElementById("broker").value.trim()
    );

    localStorage.setItem(
        "mqttUsername",
        document.getElementById("username").value.trim()
    );

    localStorage.setItem(
        "mqttPassword",
        document.getElementById("password").value
    );

    window.location.href="index.html";

});

</script>

</body>

</html>
