<!DOCTYPE html>
<html lang="fi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MQTT Dashboard - Login</title>

<style>

body{

    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#eceff1;

}

.container{

    max-width:450px;
    margin:60px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 4px 12px rgba(0,0,0,.2);

}

h1{

    text-align:center;
    color:#1565c0;

}

label{

    display:block;
    margin-top:18px;
    margin-bottom:6px;
    font-weight:bold;

}

input{

    width:100%;
    padding:10px;
    font-size:16px;
    box-sizing:border-box;

}

button{

    width:100%;
    margin-top:30px;
    padding:12px;
    font-size:18px;
    border:none;
    border-radius:6px;
    background:#1565c0;
    color:white;
    cursor:pointer;

}

button:hover{

    background:#0d47a1;

}

</style>

</head>

<body>

<div class="container">

<h1>MQTT Dashboard</h1>

<form id="loginForm">

<label for="broker">

Broker Address

</label>

<input
type="text"
id="broker"
placeholder="wss://broker.example.com:8884/mqtt"
required>

<label for="username">

Username

</label>

<input
type="text"
id="username"
required>

<label for="password">

Password

</label>

<input
type="password"
id="password"
required>

<button type="submit">

Save and Continue

</button>

</form>

</div>

<script>

document.getElementById("broker").value =
localStorage.getItem("mqttBroker") ||
"wss://220eb1c6c03d48fea06df6599189b756.s1.eu.hivemq.cloud:8884/mqtt";

document.getElementById("username").value =
localStorage.getItem("mqttUsername") || "";

document.getElementById("password").value =
localStorage.getItem("mqttPassword") || "";

document.getElementById("loginForm").addEventListener("submit",function(e){

    e.preventDefault();

    localStorage.setItem(
        "mqttBroker",
        document.getElementById("broker").value.trim()
    );

    localStorage.setItem(
        "mqttUsername",
        document.getElementById("username").value.trim()
    );

    localStorage.setItem(
        "mqttPassword",
        document.getElementById("password").value
    );

    window.location.href="index.html";

});

</script>

</body>

</html>
