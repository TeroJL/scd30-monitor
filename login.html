<!DOCTYPE html>
<html lang="fi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MQTT Dashboard - Login</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

<h1>MQTT Dashboard</h1>

<form id="loginForm">

<label for="broker">
Broker Address
</label>

<input
type="text"
id="broker"
placeholder="wss://broker.example.com:8884/mqtt"
required>

<label for="username">
Username
</label>

<input
type="text"
id="username"
required>

<label for="password">
Password
</label>

<input
type="password"
id="password"
required>

<button type="submit">
Save and Continue
</button>

</form>

</div>

<script src="js/login.js"></script>

</body>

</html>
