<div class="container">

<h1>SCD30 Sisäilman seuranta</h1>

<div class="status" id="status">
Yhdistetään...
</div>

<div class="grid">

<div class="card">
<div class="label">🌡 Lämpötila</div>
<div class="value" id="temperature">--.- °C</div>
</div>

<div class="card">
<div class="label">💧 Kosteus</div>
<div class="value" id="humidity">--.- %</div>
</div>

<div class="card">
<div class="label">🟢 CO₂</div>
<div class="value" id="co2">---- ppm</div>
</div>

</div>

<div class="updated">
Viimeisin päivitys:
<span id="time">-</span>
</div>

</div>

<script>
const topic="scd30/data";
 
const broker =
    localStorage.getItem("mqttBroker");

const username =
    localStorage.getItem("mqttUsername");

const password =
    localStorage.getItem("mqttPassword");

if(!broker || !username || !password){

    window.location.href="login.html";

}

const client = mqtt.connect(broker,{

    clientId:
        "MQTTDashboard_" +
        Math.random().toString(16).substring(2),

    username: username,

    password: password,

    clean: true

});

client.on("connect",()=>{
    document.getElementById("status").innerHTML="🟢 Yhdistetty HiveMQ:lle";
    //client.subscribe(topic);
    client.subscribe(topic, function(err){
        if(err){
            document.getElementById("status").innerHTML =
                "🔴 Tilaus epäonnistui";
            console.log(err);
        }else{
            document.getElementById("status").innerHTML =
                "🟢 Yhdistetty HiveMQ Cloudiin";
        }
    });
});

client.on("reconnect",()=>{
    document.getElementById("status").innerHTML="🟡 Yhdistetään uudelleen...";
});

client.on("error",(err)=>{
    document.getElementById("status").innerHTML="🔴 Virhe";
    console.log(err);

});

        const data=JSON.parse(message.toString());

client.on("message", (topic, message) => {
    console.log("Topic:", topic);
    console.log("Payload:", message.toString());
    try {
        const data = JSON.parse(message.toString());
        console.log(data);
        document.getElementById("temperature").innerHTML =
            data.temperature.toFixed(1) + " °C";
        document.getElementById("humidity").innerHTML =
            data.humidity.toFixed(1) + " %";
        document.getElementById("co2").innerHTML =
            data.co2 + " ppm";
        document.getElementById("time").innerHTML =
            new Date().toLocaleTimeString();
    } catch(e) {
        console.log("JSON ERROR:", e);
    }

});

console.log("testing, tässä ollaan");
    
</script>
