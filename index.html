<!DOCTYPE html>
<html lang="fi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MQTT Dashboard</title>
<script src="https://unpkg.com/mqtt@5.15.2/dist/mqtt.min.js"></script>
<style>

/* ---------- Navigation ---------- */

.navbar{

    background:#1565c0;
    color:white;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:12px 24px;

    box-shadow:0 2px 8px rgba(0,0,0,.25);

}

.nav-title{

    font-size:26px;
    font-weight:bold;

}

.nav-links{

    display:flex;
    gap:10px;
    flex-wrap:wrap;

}

.nav-links a{

    color:white;
    text-decoration:none;

    padding:10px 18px;

    border-radius:6px;

    transition:.25s;

}

.nav-links a:hover{

    background:rgba(255,255,255,.18);

}
    
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#eceff1;
    margin:0;
}

header{
    background:#1565c0;
    color:white;
    padding:20px;
    text-align:center;
    font-size:34px;
    font-weight:bold;
}

.status{
    text-align:center;
    margin:15px;
    font-size:18px;
    font-weight:bold;
}

.grid{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
    padding:20px;

}

.card{

    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.2);

}

.card h2{

    margin-top:0;
    color:#1565c0;

}

.value{

    font-size:42px;
    font-weight:bold;
    margin:8px 0;

}

.small{

    color:#666;

}

.buttons{

    text-align:center;
    margin:30px;

}

.buttons a{

    display:inline-block;
    margin:8px;
    padding:12px 22px;
    border-radius:8px;
    text-decoration:none;
    color:white;
    font-weight:bold;

}

.blue{background:#1565c0;}
.orange{background:#ef6c00;}
.green{background:#2e7d32;}
.gray{background:#616161;}

@media (max-width:800px){

.navbar{

    flex-direction:column;

    align-items:flex-start;

}

.nav-links{

    margin-top:10px;
    width:100%;

}

}
    
</style>

</head>

<body>


<nav class="navbar">

    <div class="nav-title">
        MQTT Dashboard
    </div>

    <div class="nav-links">

        <a href="index.html">🏠 Dashboard</a>

        <a href="scd30.html">🌡️ SCD30</a>

        <a href="shelly-plug.html">🔌 Shelly Plug</a>

        <a href="topics.html">📡 Topics</a>

        <a href="json.html">📄 JSON Viewer</a>

    </div>

</nav>
    
<header>

MQTT Dashboard

</header>

<div class="status" id="status">

🔴 Ei yhteyttä

</div>

<div class="grid">

<div class="card">

<h2>🌡️ SCD30</h2>

<div class="value" id="temperature">--.- °C</div>

<div class="value" id="humidity">--.- %</div>

<div class="value" id="co2">---- ppm</div>

<div class="small">

Viimeisin päivitys:
<span id="scdtime">-</span>

</div>

</div>

<div class="card">

<h2>🔌 Shelly Plug S Gen3</h2>

<div class="value" id="power">-- W</div>

<div>Jännite:
<b id="voltage">--</b> V</div>

<div>Virta:
<b id="current">--</b> A</div>

<div>Rele:
<b id="relay">--</b></div>

<div class="small">

Viimeisin päivitys:
<span id="plugtime">-</span>

</div>

</div>

<div class="card">

<h2>📡 MQTT</h2>

<div class="value" id="topics">0</div>

<div>Aktiivista topicia</div>

</div>

</div>

<script>

const broker="wss://220eb1c6c03d48fea06df6599189b756.s1.eu.hivemq.cloud:8884/mqtt";

const client=mqtt.connect(broker,{

clientId:"Dashboard_"+Math.random().toString(16).substring(2),

username:"EDUKORAU3sub",

password:"qWeRtY123",

clean:true

});

const topicSet=new Set();

client.on("connect",()=>{

document.getElementById("status").innerHTML=
"🟢 Yhdistetty HiveMQ Cloudiin";

client.subscribe("#");

});

client.on("message",(topic,message)=>{

topicSet.add(topic);

document.getElementById("topics").innerHTML=topicSet.size;

let payload=message.toString();

try{

const data=JSON.parse(payload);

if(topic==="scd30/data"){

document.getElementById("temperature").innerHTML=
data.temperature.toFixed(1)+" °C";

document.getElementById("humidity").innerHTML=
data.humidity.toFixed(1)+" %";

document.getElementById("co2").innerHTML=
data.co2+" ppm";

document.getElementById("scdtime").innerHTML=
new Date().toLocaleTimeString();

}

if(topic.endsWith("/events/rpc")){

const sw=data.params?.["switch:0"];

if(sw){

document.getElementById("power").innerHTML=
(sw.apower ?? 0).toFixed(1)+" W";

document.getElementById("voltage").innerHTML=
(sw.voltage ?? "-");

document.getElementById("current").innerHTML=
(sw.current ?? "-");

document.getElementById("relay").innerHTML=
sw.output ? "ON" : "OFF";

document.getElementById("plugtime").innerHTML=
new Date().toLocaleTimeString();

}

}

}
catch(e){

}

});

</script>

</body>

</html>
