<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCD30 Sisäilman seuranta</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#eceff1;
    margin:0;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:20px;
}

h1{
    text-align:center;
    color:#333;
}

.status{
    text-align:center;
    margin-bottom:20px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
    padding:25px;
    text-align:center;
}

.label{
    font-size:22px;
    color:#666;
}

.value{
    font-size:42px;
    font-weight:bold;
    margin-top:15px;
}

.updated{
    margin-top:30px;
    text-align:center;
    color:#666;
}

</style>

</head>

<body>

<div class="container">

<h1>SCD30 Sisäilman seuranta</h1>

<div class="status" id="status">
Yhdistetään...
</div>

<div class="grid">

<div class="card">
<div class="label">🌡 Lämpötila</div>
<div class="value" id="temperature">--.- °C</div>
</div>

<div class="card">
<div class="label">💧 Kosteus</div>
<div class="value" id="humidity">--.- %</div>
</div>

<div class="card">
<div class="label">🟢 CO₂</div>
<div class="value" id="co2">---- ppm</div>
</div>

</div>

<div class="updated">
Viimeisin päivitys:
<span id="time">-</span>
</div>

</div>

<script>

//const broker="wss://broker.hivemq.com:8884/mqtt";
const broker = "wss://220eb1c6c03d48fea06df6599189b756.s1.eu.hivemq.cloud:8884/mqtt";
const topic="scd30";

//const client=mqtt.connect(broker,{
//    clientId:"viewer_"+Math.random().toString(16).substr(2,8)
//});
const client = mqtt.connect(broker, {
    clientId: "viewer_" + Math.random().toString(16).substr(2,8),
    username: "EDUKORAU3sub",
    password: "qWeRtY123",
    clean: true,
    reconnectPeriod: 5000
});

client.on("connect",()=>{
    document.getElementById("status").innerHTML="🟢 Yhdistetty HiveMQ:lle";
    //client.subscribe(topic);
    client.subscribe(topic, function(err){
        if(err){
            document.getElementById("status").innerHTML =
                "🔴 Tilaus epäonnistui";
            console.log(err);
        }else{
            document.getElementById("status").innerHTML =
                "🟢 Yhdistetty HiveMQ Cloudiin";
        }
    });
});

client.on("reconnect",()=>{
    document.getElementById("status").innerHTML="🟡 Yhdistetään uudelleen...";
});

client.on("error",(err)=>{
    document.getElementById("status").innerHTML="🔴 Virhe";
    console.log(err);

});

            data.co2+" ppm";

        document.getElementById("time").innerHTML=
            new Date().toLocaleTimeString();
    }

    catch(e){
        console.log(e);
    }

});
*/
client.on("message", (topic, message) => {
    console.log("Topic:", topic);
    console.log("Payload:", message.toString());
    try {
        const data = JSON.parse(message.toString());
        console.log(data);
        document.getElementById("temperature").innerHTML =
            data.temperature.toFixed(1) + " °C";
        document.getElementById("humidity").innerHTML =
            data.humidity.toFixed(1) + " %";
        document.getElementById("co2").innerHTML =
            data.co2 + " ppm";
        document.getElementById("time").innerHTML =
            new Date().toLocaleTimeString();
    } catch(e) {
        console.log("JSON ERROR:", e);
    }

});


    
</script>

</body>
</html>
