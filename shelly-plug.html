<!DOCTYPE html>
<html lang="fi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Shelly Plug S Gen3 Monitor</title>

<script src="https://unpkg.com/mqtt@5.15.2/dist/mqtt.min.js"></script>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar">

    <div class="nav-title">
        MQTT Dashboard
    </div>

    <div class="nav-links">

        <a href="index.html">🏠 Dashboard</a>

        <a href="scd30.html">🌡️ SCD30</a>

        <a href="shelly-plug.html">🔌 Shelly Plug</a>

        <a href="topics.html">📡 Topics</a>

        <a href="json.html">📄 JSON Viewer</a>

    </div>

</nav>
    
<header>

Shelly Plug S Gen3 MQTT Monitor

</header>

<div class="container">

<div class="status" id="status">
Yhdistetään...
</div>

<div class="topic" id="topic">
Ei viestejä
</div>

<div class="card">

<h2>JSON</h2>

<pre id="json"></pre>

</div>

<div class="card">

<h2>Kentät</h2>

<table id="table">

</table>

</div>

</div>

<script>

const broker =
    localStorage.getItem("mqttBroker");

const username =
    localStorage.getItem("mqttUsername");

const password =
    localStorage.getItem("mqttPassword");

if(!broker || !username || !password){

    window.location.href="login.html";

}

const client = mqtt.connect(broker,{

    clientId:
        "MQTTDashboard_" +
        Math.random().toString(16).substring(2),

    username: username,

    password: password,

    clean: true

});

client.on("connect",()=>{

document.getElementById("status").innerHTML="🟢 Yhdistetty HiveMQ Cloudiin";

client.subscribe("shelly/plug1/#");

});

client.on("message",(topic,message)=>{

document.getElementById("topic").innerHTML="Aihe: "+topic;

document.getElementById("json").textContent=
JSON.stringify(JSON.parse(message.toString()),null,4);

const obj=JSON.parse(message.toString());

const table=document.getElementById("table");

table.innerHTML="";

function walk(prefix,value){

    if(typeof value==="object" && value!==null){

        for(const k in value){

            walk(prefix==""?k:prefix+"."+k,value[k]);

        }

    }

    else{

        let row=document.createElement("tr");

        let c1=document.createElement("td");

        let c2=document.createElement("td");

        c1.innerHTML=prefix;

        c2.innerHTML=value;

        row.appendChild(c1);

        row.appendChild(c2);

        table.appendChild(row);

    }

}

walk("",obj);

});

client.on("error",(e)=>{

document.getElementById("status").innerHTML="🔴 "+e;

});

</script>

</body>
</html>
