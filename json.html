<!DOCTYPE html>
<html lang="fi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MQTT JSON Viewer</title>

<script src="https://unpkg.com/mqtt@5.15.2/dist/mqtt.min.js"></script>

<style>

/* ---------- Navigation ---------- */

.navbar{

    background:#1565c0;
    color:white;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:12px 24px;

    box-shadow:0 2px 8px rgba(0,0,0,.25);

}

.nav-title{

    font-size:26px;
    font-weight:bold;

}

.nav-links{

    display:flex;
    gap:10px;
    flex-wrap:wrap;

}

.nav-links a{

    color:white;
    text-decoration:none;

    padding:10px 18px;

    border-radius:6px;

    transition:.25s;

}

.nav-links a:hover{

    background:rgba(255,255,255,.18);

}
    
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#eceff1;
    margin:0;
}

header{

    background:#1976d2;
    color:white;
    padding:15px;
    text-align:center;
    font-size:28px;

}

.container{

    max-width:1200px;
    margin:auto;
    padding:20px;

}

.card{

    background:white;
    margin-top:20px;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);

}

.status{

    font-weight:bold;

}

pre{

    background:#263238;
    color:#a5d6a7;
    padding:15px;
    border-radius:6px;
    overflow:auto;

}

table{

    width:100%;
    border-collapse:collapse;

}

td{

    padding:8px;
    border-bottom:1px solid #ddd;

}

td:first-child{

    width:350px;
    font-weight:bold;

}

button{

    margin-top:20px;
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;

}

@media (max-width:800px){

.navbar{

    flex-direction:column;

    align-items:flex-start;

}

.nav-links{

    margin-top:10px;
    width:100%;

}

}
    
</style>

</head>

<body>


<nav class="navbar">

    <div class="nav-title">
        MQTT Dashboard
    </div>

    <div class="nav-links">

        <a href="index.html">🏠 Dashboard</a>

        <a href="scd30.html">🌡️ SCD30</a>

        <a href="shelly-plug.html">🔌 Shelly Plug</a>

        <a href="topics.html">📡 Topics</a>

        <a href="json.html">📄 JSON Viewer</a>

    </div>

</nav>
    
<header>

MQTT JSON Viewer

</header>

<div class="container">

<div class="card">

<div class="status" id="status">

Yhdistetään...

</div>

<h2 id="topic"></h2>

<p>

Viimeisin vastaanotto:
<span id="time">-</span>

</p>

<p>

Viestien määrä:
<span id="count">0</span>

</p>

<button onclick="history.back()">

← Takaisin

</button>

</div>

<div class="card">

<h2>JSON</h2>

<pre id="json"></pre>

</div>

<div class="card">

<h2>Kentät</h2>

<table id="table">

</table>

</div>

</div>

<script>

const params=new URLSearchParams(window.location.search);

const topic=params.get("topic");

document.getElementById("topic").innerHTML=topic;

const broker =
    localStorage.getItem("mqttBroker");

const username =
    localStorage.getItem("mqttUsername");

const password =
    localStorage.getItem("mqttPassword");

if(!broker || !username || !password){

    window.location.href="login.html";

}

const client = mqtt.connect(broker,{

    clientId:
        "MQTTDashboard_" +
        Math.random().toString(16).substring(2),

    username: username,

    password: password,

    clean: true

});

let counter=0;

client.on("connect",()=>{

document.getElementById("status").innerHTML="🟢 Yhdistetty";

client.subscribe(topic);

});

client.on("message",(topic,message)=>{

counter++;

document.getElementById("count").innerHTML=counter;

document.getElementById("time").innerHTML=new Date().toLocaleTimeString();

let text=message.toString();

document.getElementById("json").textContent=text;

let table=document.getElementById("table");

table.innerHTML="";

try{

const obj=JSON.parse(text);

function walk(prefix,value){

    if(typeof value==="object" && value!==null){

        for(const key in value){

            walk(prefix==""?key:prefix+"."+key,value[key]);

        }

    }

    else{

        let tr=document.createElement("tr");

        let td1=document.createElement("td");

        let td2=document.createElement("td");

        td1.textContent=prefix;

        td2.textContent=value;

        tr.appendChild(td1);

        tr.appendChild(td2);

        table.appendChild(tr);

    }

}

walk("",obj);

}
catch(e){

let tr=document.createElement("tr");

let td=document.createElement("td");

td.colSpan=2;

td.textContent="Payload ei ole JSON-muotoinen.";

tr.appendChild(td);

table.appendChild(tr);

}

});

client.on("error",(e)=>{

document.getElementById("status").innerHTML="🔴 "+e;

});

</script>
    
</body>

</html>
