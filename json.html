<!DOCTYPE html>
<html lang="fi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MQTT JSON Viewer</title>

<script src="https://unpkg.com/mqtt@5.15.2/dist/mqtt.min.js"></script>

<link rel="stylesheet" href="css/style.css">

</head>

<body>


<nav class="navbar">

    <div class="nav-title">
        MQTT Dashboard
    </div>

    <div class="nav-links">

        <a href="index.html">🏠 Dashboard</a>

        <a href="scd30.html">🌡️ SCD30</a>

        <a href="shelly-plug.html">🔌 Shelly Plug</a>

        <a href="topics.html">📡 Topics</a>

        <a href="json.html">📄 JSON Viewer</a>

    </div>

</nav>
    
<header>

MQTT JSON Viewer

</header>

<div class="container">

<div class="card">

<div class="status" id="status">

Yhdistetään...

</div>

<h2 id="topic"></h2>

<p>

Viimeisin vastaanotto:
<span id="time">-</span>

</p>

<p>

Viestien määrä:
<span id="count">0</span>

</p>

<button onclick="history.back()">

← Takaisin

</button>

</div>

<div class="card">

<h2>JSON</h2>

<pre id="json"></pre>

</div>

<div class="card">

<h2>Kentät</h2>

<table id="table">

</table>

</div>

</div>

<script>

const params=new URLSearchParams(window.location.search);

const topic=params.get("topic");

document.getElementById("topic").innerHTML=topic;

const broker =
    localStorage.getItem("mqttBroker");

const username =
    localStorage.getItem("mqttUsername");

const password =
    localStorage.getItem("mqttPassword");

if(!broker || !username || !password){

    window.location.href="login.html";

}

const client = mqtt.connect(broker,{

    clientId:
        "MQTTDashboard_" +
        Math.random().toString(16).substring(2),

    username: username,

    password: password,

    clean: true

});

let counter=0;

client.on("connect",()=>{

document.getElementById("status").innerHTML="🟢 Yhdistetty";

client.subscribe(topic);

});

client.on("message",(topic,message)=>{

counter++;

document.getElementById("count").innerHTML=counter;

document.getElementById("time").innerHTML=new Date().toLocaleTimeString();

let text=message.toString();

document.getElementById("json").textContent=text;

let table=document.getElementById("table");

table.innerHTML="";

try{

const obj=JSON.parse(text);

function walk(prefix,value){

    if(typeof value==="object" && value!==null){

        for(const key in value){

            walk(prefix==""?key:prefix+"."+key,value[key]);

        }

    }

    else{

        let tr=document.createElement("tr");

        let td1=document.createElement("td");

        let td2=document.createElement("td");

        td1.textContent=prefix;

        td2.textContent=value;

        tr.appendChild(td1);

        tr.appendChild(td2);

        table.appendChild(tr);

    }

}

walk("",obj);

}
catch(e){

let tr=document.createElement("tr");

let td=document.createElement("td");

td.colSpan=2;

td.textContent="Payload ei ole JSON-muotoinen.";

tr.appendChild(td);

table.appendChild(tr);

}

});

client.on("error",(e)=>{

document.getElementById("status").innerHTML="🔴 "+e;

});

</script>
    
</body>

</html>
