<!DOCTYPE html>
<html lang="fi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MQTT Topics</title>

<script src="https://unpkg.com/mqtt@5.15.2/dist/mqtt.min.js"></script>
 
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar">

    <div class="nav-title">
        MQTT Dashboard
    </div>

    <div class="nav-links">

        <a href="index.html">🏠 Dashboard</a>

        <a href="scd30.html">🌡️ SCD30</a>

        <a href="shelly-plug.html">🔌 Shelly Plug</a>

        <a href="topics.html">📡 Topics</a>

        <a href="json.html">📄 JSON Viewer</a>

    </div>

</nav>
 
<header>

MQTT Topic Monitor

</header>

<div class="container">

<div id="status">

Yhdistetään...

</div>

<table>

<thead>

<tr>

<th>Aihe</th>

<th>Viestejä</th>

<th>Viimeisin päivitys</th>

<th>Payload</th>

</tr>

</thead>

<tbody id="topics">

</tbody>

</table>

</div>

<script>

const broker =
    localStorage.getItem("mqttBroker");

const username =
    localStorage.getItem("mqttUsername");

const password =
    localStorage.getItem("mqttPassword");

if(!broker || !username || !password){

    window.location.href="login.html";

}

const client = mqtt.connect(broker,{

    clientId:
        "MQTTDashboard_" +
        Math.random().toString(16).substring(2),

    username: username,

    password: password,

    clean: true

});

const rows={};

client.on("connect",()=>{

document.getElementById("status").innerHTML="🟢 Yhdistetty HiveMQ Cloudiin";

client.subscribe("#");

});

client.on("message",(topic,message)=>{

let payload=message.toString();

let now=new Date().toLocaleTimeString();

if(rows[topic]){

rows[topic].count++;

rows[topic].countCell.innerHTML=rows[topic].count;
rows[topic].timeCell.innerHTML=now;
rows[topic].payloadCell.textContent=payload;

}
else{

let tbody=document.getElementById("topics");

let tr=document.createElement("tr");

let tdTopic=document.createElement("td");

let tdCount=document.createElement("td");

let tdTime=document.createElement("td");

let tdPayload=document.createElement("td");

let link = document.createElement("a");
link.href = "json.html?topic=" + encodeURIComponent(topic);
link.textContent = topic;
tdTopic.appendChild(link);

 
tdCount.className="count";
tdTime.className="time";
tdPayload.className="payload";

tdCount.innerHTML="1";
tdTime.innerHTML=now;
tdPayload.textContent=payload;

tr.appendChild(tdTopic);
tr.appendChild(tdCount);
tr.appendChild(tdTime);
tr.appendChild(tdPayload);

tbody.appendChild(tr);

rows[topic]={

count:1,
countCell:tdCount,
timeCell:tdTime,
payloadCell:tdPayload

};

}

});

client.on("error",(e)=>{

document.getElementById("status").innerHTML="🔴 "+e;

});

</script>

</body>
</html>
