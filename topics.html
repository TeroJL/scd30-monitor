<!DOCTYPE html>
<html lang="fi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MQTT Topics</title>

<script src="https://unpkg.com/mqtt@5.15.2/dist/mqtt.min.js"></script>
 
<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#eceff1;
    margin:0;
}

header{

    background:#1976d2;
    color:white;
    padding:15px;
    text-align:center;
    font-size:28px;

}

.container{

    max-width:1400px;
    margin:auto;
    padding:20px;

}

#status{

    font-weight:bold;
    margin-bottom:20px;

}

table{

    width:100%;
    border-collapse:collapse;
    background:white;

}

th{

    background:#1976d2;
    color:white;
    padding:10px;

}

td{

    padding:8px;
    border-bottom:1px solid #ddd;

}

tr:hover{

    background:#f5f5f5;

}

.payload{

    max-width:650px;
    white-space:pre-wrap;
    word-break:break-word;
    font-family:Consolas,monospace;
    font-size:13px;

}

.count{

    text-align:center;

}

.time{

    white-space:nowrap;

}

a{

    color:#1976d2;
    text-decoration:none;

}

</style>

</head>

<body>

<header>

MQTT Topic Monitor

</header>

<div class="container">

<div id="status">

Yhdistetään...

</div>

<table>

<thead>

<tr>

<th>Aihe</th>

<th>Viestejä</th>

<th>Viimeisin päivitys</th>

<th>Payload</th>

</tr>

</thead>

<tbody id="topics">

</tbody>

</table>

</div>

<script>

const broker="wss://220eb1c6c03d48fea06df6599189b756.s1.eu.hivemq.cloud:8884/mqtt";

const client=mqtt.connect(broker,{

clientId:"TopicViewer_"+Math.random().toString(16).substring(2),

username:"EDUKORAU3sub",

password:"qWeRtY123",

clean:true

});

const rows={};

client.on("connect",()=>{

document.getElementById("status").innerHTML="🟢 Yhdistetty HiveMQ Cloudiin";

client.subscribe("#");

});

client.on("message",(topic,message)=>{

let payload=message.toString();

let now=new Date().toLocaleTimeString();

if(rows[topic]){

rows[topic].count++;

rows[topic].countCell.innerHTML=rows[topic].count;
rows[topic].timeCell.innerHTML=now;
rows[topic].payloadCell.textContent=payload;

}
else{

let tbody=document.getElementById("topics");

let tr=document.createElement("tr");

let tdTopic=document.createElement("td");

let tdCount=document.createElement("td");

let tdTime=document.createElement("td");

let tdPayload=document.createElement("td");

tdTopic.innerHTML="<a href='#'>"+topic+"</a>";

tdCount.className="count";
tdTime.className="time";
tdPayload.className="payload";

tdCount.innerHTML="1";
tdTime.innerHTML=now;
tdPayload.textContent=payload;

tr.appendChild(tdTopic);
tr.appendChild(tdCount);
tr.appendChild(tdTime);
tr.appendChild(tdPayload);

tbody.appendChild(tr);

rows[topic]={

count:1,
countCell:tdCount,
timeCell:tdTime,
payloadCell:tdPayload

};

}

});

client.on("error",(e)=>{

document.getElementById("status").innerHTML="🔴 "+e;

});

</script>

</body>
</html>
